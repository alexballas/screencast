name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: go test (ubuntu-latest)
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # pkg-config and libpipewire-0.3-dev are cgo build requirements for the
      # Linux capture backend. ffmpeg ships both ffmpeg and ffprobe, which the
      # end-to-end sync test encodes and measures with.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libpipewire-0.3-dev \
            ffmpeg

      # avtest.RequireTooling asserts the same list and fails the test when
      # anything is missing. Checking it here too turns a stripped ffmpeg build
      # into one clear message about the environment, rather than an encoding
      # failure several minutes into the suite.
      - name: Verify the ffmpeg toolchain
        run: |
          ffmpeg -version
          ffprobe -version

          filters=$(ffmpeg -hide_banner -filters)
          for name in signalstats astats movie amovie; do
            case "$filters" in
              *" $name "*) ;;
              *) echo "::error::ffmpeg build lacks the $name filter"; exit 1 ;;
            esac
          done

          encoders=$(ffmpeg -hide_banner -encoders)
          for name in libx264 aac; do
            case "$encoders" in
              *" $name"*) ;;
              *) echo "::error::ffmpeg build lacks the $name encoder"; exit 1 ;;
            esac
          done

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Run tests
        run: |
          set -o pipefail
          go test -v -count=1 -timeout 15m ./... 2>&1 | tee test-output.log

      # A skipped test is a test that did not run. Nothing here skips itself on
      # a machine with the toolchain, so on a runner that is meant to have it,
      # treat any skip as a broken environment.
      - name: Confirm every test ran
        run: |
          if grep -q -- "--- SKIP" test-output.log; then
            echo "::error::tests were skipped on a runner expected to run them"
            grep -- "--- SKIP" test-output.log
            exit 1
          fi
          # hls and ts each measure the same event through their own muxer, and
          # both tests carry this name. Counting rather than matching keeps the
          # gate from being satisfied by whichever one still runs.
          passed=$(grep -c -- "--- PASS: TestSessionKeepsCapturedEventInSync" test-output.log || true)
          if [ "$passed" -ne 2 ]; then
            echo "::error::expected the end-to-end sync test to pass for both hls and ts, got $passed"
            exit 1
          fi

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-output
          path: test-output.log
          if-no-files-found: ignore
